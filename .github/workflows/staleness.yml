# Dead-man's switch for the published valuation dashboard.
# Deployed to the PUBLIC pages repo (.github/workflows/staleness.yml) by scripts/publish_pages.sh.
# The morning/evening snapshot jobs republish this repo twice daily; if they stop (Mac off,
# launchd unloaded, login-session issue) the dashboard silently goes stale. This scheduled Action checks
# how long since the last publish and opens an issue (-> GitHub emails the owner) when it exceeds the
# threshold. Kept version-controlled in the main repo so it isn't hand-edited on the public side.
name: dashboard-staleness-alert
on:
  schedule:
    - cron: "30 1,13 * * *"   # 08:30 and 20:30 Asia/Bangkok — after both publish windows
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const MAX_AGE_HOURS = 14.5;                     // one missed twice-daily run, plus buffer
            const { data: commits } = await github.rest.repos.listCommits({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 1,
            });
            const last = new Date(commits[0].commit.committer.date);
            const ageH = (Date.now() - last.getTime()) / 3.6e6;
            core.info(`last publish ${last.toISOString()} — ${ageH.toFixed(1)}h ago (threshold ${MAX_AGE_HOURS}h)`);
            if (ageH <= MAX_AGE_HOURS) return;              // fresh — nothing to do
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 50,
            });
            if (open.some(i => i.title.startsWith("⚠️ Dashboard stale"))) {
              core.info("a staleness issue is already open — not duplicating");
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `⚠️ Dashboard stale — no publish in ${ageH.toFixed(0)}h`,
                body: `The valuation dashboard has not been republished since **${last.toISOString()}** `
                    + `(${ageH.toFixed(1)}h ago). The twice-daily snapshot jobs may have stopped — check `
                    + `the Mac is on, both launchd agents are loaded, and prices/data are current.`,
              });
            }
            core.setFailed(`dashboard stale for ${ageH.toFixed(1)}h`);   // second alert channel (workflow-failure email)
