# Dead-man's switch for the published valuation dashboard.
# Deployed to the PUBLIC pages repo (.github/workflows/staleness.yml) by scripts/publish_pages.sh.
# The morning/evening snapshot jobs republish this repo twice daily; if they stop (Mac off,
# launchd unloaded, login-session issue) the dashboard silently goes stale. This scheduled Action checks
# how long since the last publish on SET sessions and opens an issue (-> GitHub emails the owner) when it
# exceeds the threshold. Weekends and verified SET holidays are expected no-publish days. Keep the holiday
# set synchronized with config/set_trading_holidays.json (covered by a test). Kept version-controlled here
# so it isn't hand-edited on the public side.
name: dashboard-staleness-alert
on:
  schedule:
    - cron: "30 1,13 * * *"   # 08:30 and 20:30 Asia/Bangkok — after both publish windows
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const MAX_AGE_HOURS = 14.5;                     // one missed twice-daily run, plus buffer
            const SET_HOLIDAYS = new Set([
              "2026-01-01", "2026-01-02", "2026-03-03", "2026-04-06", "2026-04-13",
              "2026-04-14", "2026-04-15", "2026-05-01", "2026-05-04", "2026-06-01",
              "2026-06-03", "2026-07-28", "2026-07-29", "2026-08-12", "2026-10-13",
              "2026-10-16", "2026-10-23", "2026-12-07", "2026-12-10", "2026-12-31",
              "2027-01-01", "2027-02-22", "2027-04-06", "2027-04-13", "2027-04-14",
              "2027-04-15", "2027-05-03", "2027-05-04", "2027-05-20", "2027-06-03",
              "2027-07-19", "2027-07-28", "2027-08-12", "2027-10-13", "2027-10-25",
              "2027-12-06", "2027-12-10", "2027-12-31",
            ]);
            const dateParts = Object.fromEntries(
              new Intl.DateTimeFormat("en-US", {
                timeZone: "Asia/Bangkok", year: "numeric", month: "2-digit", day: "2-digit",
                weekday: "short",
              }).formatToParts(new Date()).map(part => [part.type, part.value]),
            );
            const bangkokDay = `${dateParts.year}-${dateParts.month}-${dateParts.day}`;
            const nonSession = ["Sat", "Sun"].includes(dateParts.weekday) || SET_HOLIDAYS.has(bangkokDay);
            if (nonSession) {
              core.info(`${bangkokDay} is a SET non-session day; no dashboard publish is expected`);
              return;
            }
            let last;
            let freshnessBasis = ".production-published-at";
            try {
              const { data: marker } = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo,
                path: ".production-published-at",
              });
              if (Array.isArray(marker) || !marker.content) throw new Error("invalid marker");
              last = new Date(Buffer.from(marker.content, "base64").toString("utf8").trim());
              if (Number.isNaN(last.getTime())) throw new Error("invalid timestamp");
            } catch (error) {
              // Migration fallback only. Once a full publish writes the marker,
              // World-only commits can no longer mask a stale production book.
              core.warning(`production marker unavailable (${error.message}); falling back to latest commit`);
              const { data: commits } = await github.rest.repos.listCommits({
                owner: context.repo.owner, repo: context.repo.repo, per_page: 1,
              });
              last = new Date(commits[0].commit.committer.date);
              freshnessBasis = "latest commit (migration fallback)";
            }
            const ageH = (Date.now() - last.getTime()) / 3.6e6;
            core.info(`last production publish ${last.toISOString()} via ${freshnessBasis} — ${ageH.toFixed(1)}h ago (threshold ${MAX_AGE_HOURS}h)`);
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 50,
            });
            const staleIssues = open.filter(i => i.title.startsWith("⚠️ Dashboard stale"));
            if (ageH <= MAX_AGE_HOURS) {
              for (const issue of staleIssues) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                  body: `Dashboard publishing recovered at **${last.toISOString()}**. Closing this incident automatically.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number, state: "closed",
                });
              }
              return;
            }
            if (staleIssues.length) {
              core.info("a staleness issue is already open — not duplicating");
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `⚠️ Dashboard stale — no publish in ${ageH.toFixed(0)}h`,
                body: `The valuation dashboard has not been republished since **${last.toISOString()}** `
                    + `(${ageH.toFixed(1)}h ago). The twice-daily snapshot jobs may have stopped — check `
                    + `the Mac is on, both launchd agents are loaded, and prices/data are current.`,
              });
            }
            core.setFailed(`dashboard stale for ${ageH.toFixed(1)}h`);   // second alert channel (workflow-failure email)
