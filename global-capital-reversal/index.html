  try{const source=await unlock(passphrase);sessionStorage.setItem(storageKey,passphrase);document.open();document.write(source);document.close();}
  catch(_error){sessionStorage.removeItem(storageKey);error.textContent='Could not unlock. Check the passphrase and try again.';button.disabled=false;button.textContent='Unlock';}
}
document.getElementById('unlock').addEventListener('submit',event=>{event.preventDefault();openDashboard(document.getElementById('passphrase').value);});
const saved=sessionStorage.getItem(storageKey);if(saved)openDashboard(saved);
