  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.nonce),additionalData:aad},key,bytes(payload.ciphertext));
  return new TextDecoder().decode(plain);
}
async function openDashboard(passphrase){
  const button=document.getElementById('submit'),error=document.getElementById('error');button.disabled=true;button.textContent='Unlocking…';error.textContent='';
  try{const source=await unlock(passphrase);sessionStorage.setItem(storageKey,passphrase);document.open();document.write(source);document.close();}
  catch(_error){sessionStorage.removeItem(storageKey);error.textContent='Could not unlock. Check the passphrase and try again.';button.disabled=false;button.textContent='Unlock';}
}
document.getElementById('unlock').addEventListener('submit',event=>{event.preventDefault();openDashboard(document.getElementById('passphrase').value);});
